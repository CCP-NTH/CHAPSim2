[process]
is_prerun= .false.
is_postprocess= .false.

[decomposition]
nxdomain= 1
p_row= 0
p_col= 0

# Heated rectangular duct, streamwise x, no-slip isothermal walls in BOTH y and
# z. This is the only LES case in the suite with a non-periodic z direction, so
# it is the one that exercises the z-direction property boundary buffers
# (fbcz_pc4 / fbcz_cp4) in the thermal momentum assembly and the z-wall branch
# of the subgrid coefficient classification. Every other case is z-periodic,
# which is why those paths were previously untested.
#
# The Poisson solver supports only 000, 100, 010 and (bcx,bcy) = (1,1); a z wall
# therefore forces x and y to be non-periodic as well, hence the x inlet/outlet.
[domain]
icase= channel
lxx= 8.0
lyt= 1.0
lyb= -1.0
lzz= 2.0

[flow]
initfl= poiseuille
irestartfrom= 0
veloinit= 0.0,0.0,0.0
noiselevel= 0.25
is_active_tripping= .false.
reni= 5000
nreni= 10000
ren= 5000

[thermo]
ithermo= .true.
icht= .false.
igravity= 0.0,0.0,0.0
ifluid= scp_water
ref_l0= 0.0015
ref_t0= 645.15
inittm= const
irestartfrom= 0
tini= 645.15
inout_buffer= 2.0, 0.0
qw_ramp= .false., 21, 30

[les]
LESmode= WALE

[mesh]
ncx= 48
ncy= 48
ncz= 48
istret= twosides
rstret= 3fmd,0.10

# Both wall pairs are held at 640.15 / 652.15 K against a 645.15 K core, so the
# resolved enthalpy gradient is large at all four walls and the subgrid heat
# flux has an appreciable magnitude in y AND in z - the point of the case.
[bc]
ifbcx_u= 11,7,0.0,0.0
ifbcx_v= 11,7,0.0,0.0
ifbcx_w= 11,7,0.0,0.0
ifbcx_p= 5,5,0.0,0.0
ifbcx_t= 4,5,645.15,0.0
ifbcy_u= 4,4,0.0,0.0
ifbcy_v= 4,4,0.0,0.0
ifbcy_w= 4,4,0.0,0.0
ifbcy_p= 5,5,0.0,0.0
ifbcy_t= 4,4,640.15,652.15
ifbcz_u= 4,4,0.0,0.0
ifbcz_v= 4,4,0.0,0.0
ifbcz_w= 4,4,0.0,0.0
ifbcz_p= 5,5,0.0,0.0
ifbcz_t= 4,4,640.15,652.15
idriven= none
drivenfc= 0.0

[scheme]
dt= 1e-05
itimescheme= rk3
iaccuracy= cp4
iviscous= explicit
out_sponge_L_Re= 0.0, 100.0

[simcontrol]
niterflowfirst= 1
niterflowlast= 40
niterthermofirst= 11
niterthermolast= 40

[io]
cpu_nfre= 10
ckpt_nfre= 50
visu_idim= 2
visu_nfre= 40
visu_nskip= 1,1,1
stat_istart= 30
stat_level= 3
stat_nskip= 1,1,1
is_record_xoutlet_read_xinlet= .false.,.false.
ndbfre_ndbstart_ndbend= 20,21,40
existing_output_policy= overwrite
restart_data_layout= bundled

[probe]
npp= 1
pt1= 3.141593,0.0,0.5
