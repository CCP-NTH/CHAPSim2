; Solid-body-rotation gate for the cylindrical LES velocity-gradient assembly.
;
; The initial field is u_x = 1, u_r = 0, u_theta = Omega*r with Omega = 1, and the
; wall moves with it (ifbcy_u and ifbcy_w carry the same values at r = 1). That is
; an exact zero-strain state, so "max. initial strain rate S_ijS_ij" must be machine
; zero. A Cartesian gradient assembly in cylindrical coordinates - differentiating
; the stored qy = r*u_r instead of u_r, or dropping the -u_theta/r metric term -
; returns S_r,theta = Omega/2 and hence S_ijS_ij = Omega^2/2 = 0.5 instead.
;
; Two settings are load-bearing and must not be "tidied":
;   istret= none     a CD2 derivative reproduces a function linear in *physical* r
;                    exactly only under a linear mapping; on a stretched mesh the
;                    gate leaks O(Omega*eps) and stops being machine zero.
;   idriven= no      the flow is already at its intended state; any massflux forcing
;                    would rescale it.
; The metric is taken on the initial field, before any stepping, so the single
; iteration below exists only to make the solver write the metrics file.

[process]
is_prerun= .false.
is_postprocess= .false.

[decomposition]
nxdomain= 1
p_row= 0
p_col= 0

[domain]
icase= pipe
lxx= 4.0
lyt= 1.0
lyb= 0.0
lzz= 6.283186

[flow]
initfl= function
irestartfrom= 0
veloinit= 1.0,0.0,1.0
noiselevel= 0.0
is_active_tripping= .false.
reni= 2650
nreni= 10000
ren= 2650

[les]
LESmode= WALE

[mesh]
ncx= 16
ncy= 24
ncz= 32
istret= none
rstret= tanh,0.1

[bc]
ifbcx_u= 1,1,0.0,0.0
ifbcx_v= 1,1,0.0,0.0
ifbcx_w= 1,1,0.0,0.0
ifbcx_p= 1,1,0.0,0.0
ifbcx_t= 1,1,0.0,0.0
ifbcy_u= 0,4,0.0,1.0
ifbcy_v= 0,4,0.0,0.0
ifbcy_w= 0,4,0.0,1.0
ifbcy_p= 0,5,0.0,0.0
ifbcy_t= 0,4,0.0,0.0
ifbcz_u= 1,1,0.0,0.0
ifbcz_v= 1,1,0.0,0.0
ifbcz_w= 1,1,0.0,0.0
ifbcz_p= 1,1,0.0,0.0
ifbcz_t= 1,1,0.0,0.0
idriven= no
drivenfc= 0.0

[scheme]
dt= 2e-03
itimescheme= rk3
iaccuracy= cd2
iviscous= explicit
out_sponge_L_Re= 0.0, 100.0

[simcontrol]
niterflowfirst= 1
niterflowlast= 1
niterthermofirst= 0
niterthermolast= 0

[io]
cpu_nfre= 10
ckpt_nfre= 100
visu_idim= 2
visu_nfre= 100
visu_nskip= 1,1,1
stat_istart= 100
stat_level= 3
stat_nskip= 1,1,1
is_record_xoutlet_read_xinlet= .false.,.false.
ndbfre_ndbstart_ndbend= 100,101,200
existing_output_policy= overwrite
restart_data_layout= bundled

[probe]
npp= 1
pt1= 2.0,0.2,3.14
