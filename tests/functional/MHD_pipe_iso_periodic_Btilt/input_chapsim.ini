[process]
is_prerun= .false.
is_postprocess= .false.

[decomposition]
nxdomain= 1
p_row= 0
p_col= 0

[domain]
icase= pipe
lxx= 8.0
lyt= 1.0
lyb= 0.0
lzz= 6.283186

[flow]
initfl= poiseuille
irestartfrom= 0
veloinit= 0.0,0.0,0.0
noiselevel= 0.1
is_active_tripping= .false.
reni= 2650
nreni= 10000
ren= 2650

[mhd]
imhd_xdom= .true.
NStuart= .false., 0.0
NHartmn= .true., 1.0
B_static= 10.0, 20.0, 5.0
# A deliberately general field: every one of the nine products in
# cross_production_mhd is non-zero here. Every other MHD case ships a
# wall-normal B = (0, By, 0), under which ux*by, uy*bx, uz*bx, ux*bz and uy*bz
# all vanish identically, so more than half of u x B and j x B - and the
# interpolation/transpose chains that feed bx and bz - are never executed.
# B_static is the field already scaled by the reference field that defines
# NHartmn, so a unit vector is the self-consistent choice; |B| = 22.9 here, and
# the Lorentz force scales as NStuart * |B|^2, i.e. as (NHartmn * |B|)^2. NHartmn
# is therefore set to 1 rather than the parent case's 10, giving an effective
# Hartmann number of about 23 - the same order as the parent, not a blow-up.
# This case exists to exercise code paths, not to reproduce a benchmark.
# Lower y is the pipe axis (IBC_INTERIOR), which is not a boundary of the
# physical domain and must inherit; only the outer wall carries j.n = 0.
ebcx= periodic, periodic
ebcy= inherit, insulating
ebcz= periodic, periodic

[mesh]
ncx= 64
ncy= 48
ncz= 64
istret= top
rstret= tanh,0.1

[bc]
ifbcx_u= 1,1,0.0,0.0
ifbcx_v= 1,1,0.0,0.0
ifbcx_w= 1,1,0.0,0.0
ifbcx_p= 1,1,0.0,0.0
ifbcx_t= 1,1,0.0,0.0
ifbcy_u= 0,4,0.0,0.0
ifbcy_v= 0,4,0.0,0.0
ifbcy_w= 0,4,0.0,0.0
ifbcy_p= 0,5,0.0,0.0
ifbcy_t= 0,4,0.0,0.0
ifbcz_u= 1,1,0.0,0.0
ifbcz_v= 1,1,0.0,0.0
ifbcz_w= 1,1,0.0,0.0
ifbcz_p= 1,1,0.0,0.0
ifbcz_t= 1,1,0.0,0.0
idriven= x_massflux
drivenfc= 0.0

[scheme]
dt= 2e-03
itimescheme= rk3
iaccuracy= cd2
iviscous= explicit
out_sponge_L_Re= 0.0, 100.0

[simcontrol]
niterflowfirst= 1
niterflowlast= 60
niterthermofirst= 0
niterthermolast= 0

[io]
cpu_nfre= 10
ckpt_nfre= 50
visu_idim= 2
visu_nfre= 20
visu_nskip= 1,1,1
stat_istart= 30
stat_level= 3
stat_nskip= 1,1,1
is_record_xoutlet_read_xinlet= .false.,.false.
ndbfre_ndbstart_ndbend= 20,21,60
existing_output_policy= overwrite
restart_data_layout= bundled

[probe]
npp= 1
pt1= 4.0,0.2,3.14
