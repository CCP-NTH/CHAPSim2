# Step 2: identity remap prerun. Target mesh equals the source mesh.
#
# Part of tests/functional/mesh_mapping - see docs/mesh_mapping.md.
[process]
is_prerun= .true.
is_postprocess= .false.

[decomposition]
nxdomain= 1
p_row= 0
p_col= 0

[domain]
icase= channel
lxx= 6.283186
lyt= 1.0
lyb= -1.0
lzz= 3.141593

[flow]
initfl= restart
irestartfrom= 20
veloinit= 0.0,0.0,0.0
noiselevel= 0.05
is_active_tripping= .false.
reni= 2800
nreni= 10000
ren= 2800

[thermo]
ithermo= .true.
icht= .false.
igravity= 0.0,0.0,0.0
ifluid= scp_water
ref_l0= 0.0015
ref_t0= 645.15
inittm= restart
irestartfrom= 20
tini= 645.15
inout_buffer= 0.0, 0.0

[mesh]
ncx= 32
ncy= 40
ncz= 32
istret= twosides
rstret= 3fmd,0.12

[bc]
ifbcx_u= 11,7,0.0,0.0
ifbcx_v= 11,7,0.0,0.0
ifbcx_w= 11,7,0.0,0.0
ifbcx_p= 5,5,0.0,0.0
ifbcx_t= 4,5,0.0,0.0
ifbcy_u= 4,4,0.0,0.0
ifbcy_v= 4,4,0.0,0.0
ifbcy_w= 4,4,0.0,0.0
ifbcy_p= 5,5,0.0,0.0
ifbcy_t= 4,4,645.15,648.15
ifbcz_u= 1,1,0.0,0.0
ifbcz_v= 1,1,0.0,0.0
ifbcz_w= 1,1,0.0,0.0
ifbcz_p= 1,1,0.0,0.0
ifbcz_t= 1,1,0.0,0.0
idriven= none
drivenfc= 0.0

[scheme]
dt= 1e-05
itimescheme= rk3
iaccuracy= cd2
iviscous= explicit
out_sponge_L_Re= 0.0, 100.0

[simcontrol]
niterflowfirst= 1
niterflowlast= 40
niterthermofirst= 1
niterthermolast= 40

[io]
cpu_nfre= 10
ckpt_nfre= 40
visu_idim= 2
visu_nfre= 10000
visu_nskip= 1,1,1
stat_istart= 10000
stat_level= 3
stat_nskip= 1,1,1
is_record_xoutlet_read_xinlet= .false.,.false.
ndbfre_ndbstart_ndbend= 20,21,60
existing_output_policy= overwrite
restart_data_layout= bundled

[probe]
npp= 1
pt1= 3.141593,0.0,1.5707965
