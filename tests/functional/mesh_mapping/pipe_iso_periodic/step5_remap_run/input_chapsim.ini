# Step 5: run the refined field on its own mesh.
#
# Part of tests/functional/mesh_mapping - see docs/mesh_mapping.md.
[process]
is_prerun= .false.
is_postprocess= .false.

[decomposition]
nxdomain= 1
p_row= 0
p_col= 0

[domain]
icase= pipe
lxx= 4.0
lyt= 1.0
lyb= 0.0
lzz= 6.283186

[flow]
initfl= restart
irestartfrom= 0
veloinit= 0.0,0.0,0.0
noiselevel= 0.1
is_active_tripping= .false.
reni= 2650
nreni= 10000
ren= 2650

[mesh]
ncx= 24
ncy= 40
ncz= 40
istret= top
rstret= tanh,0.1

[bc]
ifbcx_u= 1,1,0.0,0.0
ifbcx_v= 1,1,0.0,0.0
ifbcx_w= 1,1,0.0,0.0
ifbcx_p= 1,1,0.0,0.0
ifbcx_t= 1,1,0.0,0.0
ifbcy_u= 0,4,0.0,0.0
ifbcy_v= 0,4,0.0,0.0
ifbcy_w= 0,4,0.0,0.0
ifbcy_p= 0,5,0.0,0.0
ifbcy_t= 0,4,0.0,0.0
ifbcz_u= 1,1,0.0,0.0
ifbcz_v= 1,1,0.0,0.0
ifbcz_w= 1,1,0.0,0.0
ifbcz_p= 1,1,0.0,0.0
ifbcz_t= 1,1,0.0,0.0
idriven= x_massflux
drivenfc= 0.0

[scheme]
dt= 2e-03
itimescheme= rk3
iaccuracy= cd2
iviscous= explicit
out_sponge_L_Re= 0.0, 100.0

[simcontrol]
niterflowfirst= 1
niterflowlast= 20
niterthermofirst= 0
niterthermolast= 0

[io]
cpu_nfre= 10
ckpt_nfre= 20
visu_idim= 2
visu_nfre= 10000
visu_nskip= 1,1,1
stat_istart= 10000
stat_level= 3
stat_nskip= 1,1,1
is_record_xoutlet_read_xinlet= .false.,.false.
ndbfre_ndbstart_ndbend= 20,21,60
existing_output_policy= overwrite
restart_data_layout= bundled

[probe]
npp= 1
pt1= 2.000000,0.2,3.14
