; Restart equivalence of the time-averaged statistics.
;
; Restarts from iteration 40 with stat_istart unchanged at 20, so irestartfrom >
; stat_istart and the stored averages - with their sample count of 20 - are
; reloaded and continued to 50. The t_avg_* fields must then match run_continuous.
; Contrast tgv_iso next door, which raises stat_istart to the restart point and
; so deliberately exercises the start-from-empty path instead.
[process]
is_prerun= .false.
is_postprocess= .false.

[decomposition]
nxdomain= 1
p_row= 0
p_col= 0

[domain]
icase= tgv3d
lxx= 6.283186
lyt= 3.141593
lyb= -3.141593
lzz= 6.283186

[flow]
initfl= restart
irestartfrom= 40
veloinit= 0.0,0.0,0.0
noiselevel= 0.0
is_active_tripping= .false.
reni= 1600
nreni= 0
ren= 1600

[mesh]
ncx= 32
ncy= 32
ncz= 32
istret= none
rstret= uniform,0.0

[bc]
ifbcx_u= 1,1,0.0,0.0
ifbcx_v= 1,1,0.0,0.0
ifbcx_w= 1,1,0.0,0.0
ifbcx_p= 1,1,0.0,0.0
ifbcx_t= 1,1,0.0,0.0
ifbcy_u= 1,1,0.0,0.0
ifbcy_v= 1,1,0.0,0.0
ifbcy_w= 1,1,0.0,0.0
ifbcy_p= 1,1,0.0,0.0
ifbcy_t= 1,1,0.0,0.0
ifbcz_u= 1,1,0.0,0.0
ifbcz_v= 1,1,0.0,0.0
ifbcz_w= 1,1,0.0,0.0
ifbcz_p= 1,1,0.0,0.0
ifbcz_t= 1,1,0.0,0.0
idriven= none
drivenfc= 0.0

[scheme]
dt= 1e-03
itimescheme= rk3
iaccuracy= cp6
iviscous= explicit
out_sponge_L_Re= 0.0, 100.0

[simcontrol]
niterflowfirst= 41
niterflowlast= 50
niterthermofirst= 0
niterthermolast= 0

[io]
cpu_nfre= 1
ckpt_nfre= 20
visu_idim= 2
visu_nfre= 50
visu_nskip= 1,1,1
stat_istart= 20
stat_level= 3
stat_nskip= 1,1,1
is_record_xoutlet_read_xinlet=  .false.,.false.
ndbfre_ndbstart_ndbend=  0,0,0
existing_output_policy= overwrite
restart_data_layout= bundled

[probe]
npp= 1
pt1= 0.0, 0.0, 0.0
