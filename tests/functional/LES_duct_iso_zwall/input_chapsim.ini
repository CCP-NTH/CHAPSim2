[process]
is_prerun= .false.
is_postprocess= .false.

[decomposition]
nxdomain= 1
p_row= 0
p_col= 0

# Isothermal rectangular duct, streamwise x, no-slip walls in BOTH y and z.
# This is LES_duct_scp_zwall_Tw with ithermo= .false. and nothing else changed -
# the two are a matched thermal/isothermal pair over the same mesh and the same
# boundary set.
#
# Why both are needed: the isothermal momentum assembly in eq_momentum2.f90 is a
# separate branch from the thermal one, and it carries its own z-staggered
# transpose (qxiz_pcp_zpencil -> y pencil, descriptor dpcp). That descriptor is
# indistinguishable from dpcc whenever z is periodic, because 2decomp then sets
# np = nc for a 'p' location; with a z wall np = nc+1 and the wrong descriptor
# reads past the end of the array on more than one rank. No thermal case can
# reach that branch, so the thermal duct cannot cover it. Run this one at NP > 1.
#
# The Poisson solver supports only 000, 100, 010 and (bcx,bcy) = (1,1); a z wall
# therefore forces x and y to be non-periodic as well, hence the x inlet/outlet.
[domain]
icase= channel
lxx= 8.0
lyt= 1.0
lyb= -1.0
lzz= 2.0

[flow]
initfl= poiseuille
irestartfrom= 0
veloinit= 0.0,0.0,0.0
noiselevel= 0.25
is_active_tripping= .false.
reni= 5000
nreni= 10000
ren= 5000

[thermo]
ithermo= .false.
icht= .false.
igravity= 0.0,0.0,0.0
ifluid= scp_water
ref_l0= 0.0015
ref_t0= 645.15
inittm= const
irestartfrom= 0
tini= 645.15
inout_buffer= 2.0, 0.0
qw_ramp= .false., 21, 30

[les]
LESmode= WALE

[mesh]
ncx= 48
ncy= 48
ncz= 48
istret= twosides
rstret= 3fmd,0.10

# The wall temperatures below are inert at ithermo= .false.; they are left at
# the values of the thermal twin so the two inputs differ in exactly one line.
[bc]
ifbcx_u= 11,7,0.0,0.0
ifbcx_v= 11,7,0.0,0.0
ifbcx_w= 11,7,0.0,0.0
ifbcx_p= 5,5,0.0,0.0
ifbcx_t= 4,5,645.15,0.0
ifbcy_u= 4,4,0.0,0.0
ifbcy_v= 4,4,0.0,0.0
ifbcy_w= 4,4,0.0,0.0
ifbcy_p= 5,5,0.0,0.0
ifbcy_t= 4,4,640.15,652.15
ifbcz_u= 4,4,0.0,0.0
ifbcz_v= 4,4,0.0,0.0
ifbcz_w= 4,4,0.0,0.0
ifbcz_p= 5,5,0.0,0.0
ifbcz_t= 4,4,640.15,652.15
idriven= none
drivenfc= 0.0

[scheme]
dt= 1e-05
itimescheme= rk3
iaccuracy= cp4
iviscous= explicit
out_sponge_L_Re= 0.0, 100.0

[simcontrol]
niterflowfirst= 1
niterflowlast= 40
niterthermofirst= 11
niterthermolast= 40

[io]
cpu_nfre= 10
ckpt_nfre= 50
visu_idim= 2
visu_nfre= 40
visu_nskip= 1,1,1
stat_istart= 30
stat_level= 3
stat_nskip= 1,1,1
is_record_xoutlet_read_xinlet= .false.,.false.
ndbfre_ndbstart_ndbend= 20,21,40
existing_output_policy= overwrite
restart_data_layout= bundled

[probe]
npp= 1
pt1= 3.141593,0.0,0.5
