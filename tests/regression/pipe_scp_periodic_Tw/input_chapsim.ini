[process]
is_prerun= .false.
is_postprocess= .false.

[decomposition]
nxdomain= 1
p_row= 0
p_col= 0

[domain]
icase= pipe
lxx= 8.0
lyt= 1.0
lyb= 0.0
lzz= 6.283186

[flow]
initfl= poiseuille
irestartfrom= 20
veloinit= 0.0,0.0,0.0
noiselevel= 0.25
is_active_tripping= .false.
reni= 5000
nreni= 10000
ren= 5000

[thermo]
ithermo= .true.
icht= .false.
igravity= 0.0,-1.0,0.0
ifluid= scp_water
ref_l0= 0.001
ref_t0= 645.15
inittm= smooth
irestartfrom= 0
tini= 645.15
inout_buffer= 0.0, 0.0
qw_ramp= .false., 21, 30

[mesh]
ncx= 80
ncy= 48
ncz= 64
istret= top
rstret= tanh,0.1

[bc]
ifbcx_u= 1,1,0.0,0.0
ifbcx_v= 1,1,0.0,0.0
ifbcx_w= 1,1,0.0,0.0
ifbcx_p= 1,1,0.0,0.0
ifbcx_t= 1,1,0.0,0.0
ifbcy_u= 0,4,0.0,0.0
ifbcy_v= 0,4,0.0,0.0
ifbcy_w= 0,4,0.0,0.0
ifbcy_p= 0,5,0.0,0.0
ifbcy_t= 0,4,0.0,650.15
ifbcz_u= 1,1,0.0,0.0
ifbcz_v= 1,1,0.0,0.0
ifbcz_w= 1,1,0.0,0.0
ifbcz_p= 1,1,0.0,0.0
ifbcz_t= 1,1,0.0,0.0
idriven= x_massflux
drivenfc= 0.0

[scheme]
dt= 1e-05
itimescheme= rk3
iaccuracy= cd2
iviscous= explicit
out_sponge_L_Re= 0.0, 100.0

[simcontrol]
niterflowfirst= 1 
niterflowlast= 60
niterthermofirst= 1
niterthermolast= 60

[io]
cpu_nfre= 10
ckpt_nfre= 50
visu_idim= 2
visu_nfre= 20
visu_nskip= 1,1,1
stat_istart= 30
stat_level= 3
stat_nskip= 1,1,1
is_record_xoutlet_read_xinlet= .false.,.false.
ndbfre_ndbstart_ndbend= 0,0,0
existing_output_policy= overwrite
restart_data_layout= bundled

[probe]
npp= 1
pt1= 4.0,0.2,3.14
