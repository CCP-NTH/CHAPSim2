[process]
is_prerun= .false.
is_postprocess= .false.

[decomposition]
nxdomain= 1
p_row= @PROW@
p_col= @PCOL@

[domain]
icase= channel
lxx= 8.0
lyt= 1.0
lyb= -1.0
lzz= 4.0

[flow]
initfl= restart
irestartfrom= @FLOWFROM@
veloinit= 0.0,0.0,0.0
noiselevel= 0.25
is_active_tripping= .false.
reni= 5000
nreni= 10000
ren= 5000

[thermo]
ithermo= .true.
icht= .false.
igravity= 0.0,0.0,0.0
ifluid= sodium
ref_l0= 0.0015
ref_t0= 600.0
inittm= linear
irestartfrom= 0
tini= 600.0
inout_buffer= 0.0, 0.0
qw_ramp= .false., 0, 0

[mesh]
ncx= 32
ncy= 48
ncz= 32
istret= twosides
rstret= 3fmd,0.10

[bc]
ifbcx_u= 1,1,0.0,0.0
ifbcx_v= 1,1,0.0,0.0
ifbcx_w= 1,1,0.0,0.0
ifbcx_p= 1,1,0.0,0.0
ifbcx_t= 1,1,0.0,0.0
ifbcy_u= 4,4,0.0,0.0
ifbcy_v= 4,4,0.0,0.0
ifbcy_w= 4,4,0.0,0.0
ifbcy_p= 5,5,0.0,0.0
ifbcy_t= 4,4,580.0,640.0
ifbcz_u= 1,1,0.0,0.0
ifbcz_v= 1,1,0.0,0.0
ifbcz_w= 1,1,0.0,0.0
ifbcz_p= 1,1,0.0,0.0
ifbcz_t= 1,1,0.0,0.0
idriven= x_massflux
drivenfc= 0.0

[scheme]
dt= 1e-03
itimescheme= rk3
iaccuracy= cd2
iviscous= explicit
out_sponge_L_Re= 0.0, 100.0

[simcontrol]
niterflowfirst= @FIRST@
niterflowlast= @LAST@
niterthermofirst= @FIRST@
niterthermolast= @LAST@

[io]
cpu_nfre= 1
ckpt_nfre= @CKPT@
visu_idim= 2
visu_nfre= 100000
visu_nskip= 1,1,1
stat_istart= 100000
stat_level= 3
stat_nskip= 1,1,1
is_record_xoutlet_read_xinlet= .false.,.false.
ndbfre_ndbstart_ndbend= 0,0,0
existing_output_policy= overwrite
restart_data_layout= bundled
restart_history_mode= exact

[probe]
npp= 1
pt1= 3.141593,0.0,1.5707965
