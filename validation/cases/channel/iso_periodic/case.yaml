id: channel_iso_periodic
title: Isothermal periodic channel validation
geometry: channel
physics: isothermal
boundary_condition: periodic
regression_case: tests/channel_iso_periodic
input_file: tests/channel_iso_periodic/input_chapsim.ini
run_script: tests/channel_iso_periodic/run_chapsim.sh
reference_metrics: tests/channel_iso_periodic/reference.json
solver_output_dirs:
  - 1_data
  - 2_visu
  - 3_monitor
  - 4_check
references:
  - id: mkm_retau180
    path: validation/references/channel/mkm/retau180
    source: Moser-Kim-Mansour channel DNS profiles
  - id: mkm_retau395
    path: validation/references/channel/mkm/retau395
    source: Moser-Kim-Mansour channel DNS profiles
case_specific_postprocessing:
  - post/1_data/postprocess_channel_wall_units.py
  - post/2_visu/postprocess_channel_wall_units.py
  - post/2_visu/plot_channel_velo_stress.py
shared_tools:
  - validation/tools/scripts/plot_monitor_bulk_change_history.py
  - validation/tools/scripts/plot_monitor_points.py
  - validation/tools/scripts/plot_monitor_points_seperate.py
  - validation/tools/scripts/plot_check_mesh.py
suites:
  - regression_standard
  - regression_extended
