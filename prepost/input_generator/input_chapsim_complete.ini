# Complete CHAPSim2 input example.
#
# This file is intended as a parser-friendly catalogue of all currently
# supported user-facing keys in input_chapsim.ini. The active values form a
# single example case; adjust them for a real run.
#
# Important parser rule:
#   Full-line comments starting with # or ; are accepted anywhere, including
#   inside sections. Inline comments after active values are not supported.
#   Order-independent sections: [process], [decomposition], [mhd],
#   [simcontrol], and [probe].
#   All other sections expect their active keys in the documented order:
#   [domain], [flow], [thermo], [bc], [mesh], [scheme], [les], and [io].
#
# Required and optional keys:
#   The example below lists every supported key with one active value. Keys not
#   listed as optional here should be treated as required when their section is
#   present.
#
#   [decomposition]
#     optional: nxdomain, default 1.
#
#   [flow]
#     optional: irestartfrom, required only when initfl=0/restart.
#     optional: veloinit, required only when initfl=4/constant value.
#     optional: noiselevel, required only when initfl=2/random or 5/Poiseuille.
#     optional: is_active_tripping, default .false.
#     optional: reni, default is ren.
#
#   [thermo]
#     optional: qw_ramp, default .false., 0, 0.
#
#   [scheme]
#     optional: iviscous, default 1/explicit.
#     optional: out_sponge_L_Re, default 0.0, 0.0.
#
#   [mesh]
#     optional: poisson_y_method, default auto. Values: auto, fft, tdma.
#
#   [mhd]
#     optional: ebcx, ebcy, ebcz; default inherit on both sides.
#
#   [simcontrol]
#     optional: restart_clock, default continue. Values: continue, reset.
#       continue: the checkpoint iteration and time become the run clock.
#       reset:    the checkpoint is an initial condition only; the run clock
#                 starts at iteration 0 and time 0, the stored RHS history is
#                 discarded and the stored statistics are not read, so all
#                 niter*, stat_istart, ndbstart/ndbend, initReTo and qw_ramp
#                 bounds must be expressed on the new clock.
#       If both the flow and the thermal field restart, they must restart from
#       the same irestartfrom: a run advances on one timeline.
#
#   [io]
#     optional: visu_nskip, default 1, 1, 1.
#     optional: stat_nskip, default 1, 1, 1.
#     optional: is_record_xoutlet_read_xinlet, default .false., .false.
#     optional: ndbfre_ndbstart_ndbend, default 0, 0, 0.
#     optional: ndb_file_offset, default 0. Adds an offset to xoutlet database filenames.
#     optional: existing_output_policy, default overwrite.
#     optional: restart_data_layout, restart_data_layout_read, restart_data_layout_write; defaults per_field.
#     optional: restart_history_mode, default exact. Values: exact, compact.
#     optional: reset_unit_massflux, default .false.
#     optional: visu_precision, default 4/single precision.
#
# Common integer values:
#   icase: 0 other, 1 channel, 2 pipe, 3 annular, 4 TGV3D, 5 duct,
#          6 TGV2D, 7 Burgers, 8 algorithm test.
#   initfl: 0 restart, 2 random, 3 inlet, 4 constant value,
#           5 Poiseuille, 6 analytic/function.
#   inittm: 0 restart, 4 constant value, 6 analytic/function,
#           7 linear interpolation from boundary conditions,
#           8 smooth interpolation from boundary conditions (quadratic with
#             zero gradient on a pipe axis or an adiabatic wall; same as 7
#             when both y sides are Dirichlet).
#   boundary condition ids: 0 interior, 1 periodic, 2 symmetric, 3 asymmetric,
#                           4 Dirichlet, 5 Neumann, 6 interpolation,
#                           7 convective, 9 profile1D, 10 database,
#                           11 Poiseuille, 12 other/interpolation.
#   istret: 0 none, 1 centre, 2 two sides, 3 bottom, 4 top.
#   rstret first value/method: 0 uniform, 1 3FMD, 2 tanh, 3 power-law.
#   itimescheme: 0 Euler, 1 AB2, 2 RK3-CN, 3 RK3.
#   iaccuracy: 1 CD2, 2 CD4, 3 compact 4th, 4 compact 6th.
#   iviscous: 1 explicit, 2 semi-implicit.
#   idriven: 0 none, 1 x mass flux, 2 x wall shear, 3 x pressure gradient,
#            4 z mass flux, 5 z wall shear, 6 z pressure gradient.
#   ifluid: 1 SCP water, 2 SCP CO2, 3 sodium, 4 lead, 5 bismuth, 6 LBE,
#           8 lithium, 9 FLiBe, 10 PbLi. (7 is reserved for ordinary liquid
#           water and is not implemented.)
#   LESmode: 0/DNS/NONE/NO or 1/WALE.
#   stat_level: 0 none, 1 first moments, 2 second moments, 3+ extended moments.
#   visu_idim: 0 3D only, 1 2D planes only, 2 both 3D and 2D planes.
#   stat_visu_mode: all writes t_avg and tsp_avg visualised statistics;
#                   tsp_only writes tsp_avg visualised statistics only.
#   ndb_file_offset: file-iteration offset for inlet/outlet database chunks.
#                    Example: offset 431250 maps internal chunk 0 to file *_431250.*.
#   existing_output_policy: overwrite, skip, rename_existing.
#   restart_data_layout: backward-compatible alias for read/write layouts.
#   restart_data_layout_read/write: per_field or bundled; explicit keys override restart_data_layout.
#   restart_history_mode: exact stores RHS/property history for restart equivalence;
#                         compact omits history and uses startup handling after restart.
#   reset_unit_massflux: optional restart restore rescaling to make streamwise bulk q exactly 1.
#   visu_precision: 4 single precision output, 8 double precision output.
#   ebcx/ebcy/ebcz: electrical boundary condition of the MHD electric potential,
#                   two values, lower side then upper side. Values:
#                     inherit    - copy the pressure bc of that side (default)
#                     insulating - j.n = 0, i.e. d(ep)/dn = (u x B).n
#                     conducting - ep = const (recognised, not yet implemented)
#                     periodic   - must match the mesh periodicity
#                   It is a separate input from the pressure bc because the two are
#                   independent physics; they merely coincide in the cases shipped
#                   today. An interior side (pipe axis, domain join) must inherit.

[process]
is_prerun= .false.
is_postprocess= .false.

[decomposition]
nxdomain= 1
p_row= 0
p_col= 0

[domain]
icase= channel
lxx= 8.0
lyt= 1.0
lyb= -1.0
lzz= 4.0

[flow]
initfl= Poiseuille
irestartfrom= 0
veloinit= 0.0, 0.0, 0.0
noiselevel= 0.00
is_active_tripping= .false.
reni= 5000.0
nreni= 10000
ren= 5000.0

[thermo]
ithermo= .true.
icht= .false.
igravity= 0.0, -1.0, 0.0
ifluid= scp_water
ref_l0= 0.0015
ref_t0= 645.15
inittm= linear
irestartfrom= 0
tini= 645.15
inout_buffer= 0.0, 0.0
qw_ramp= .false., 21, 30

[mhd]
imhd_xdom= .true.
NStuart= .true., 0.10
NHartmn= .false., 0.0
B_static= 0.0, 1.0, 0.0
ebcx= inherit, inherit
ebcy= inherit, inherit
ebcz= inherit, inherit

[les]
LESmode= WALE

[mesh]
ncx= 64
ncy= 80
ncz= 64
istret= twosides
rstret= 3fmd, 0.10
poisson_y_method= auto

[bc]
ifbcx_u= 10, 7, 0.0, 0.0
ifbcx_v= 10, 7, 0.0, 0.0
ifbcx_w= 10, 7, 0.0, 0.0
ifbcx_p= 5, 5, 0.0, 0.0
ifbcx_t= 4, 5, 645.15, 0.0
ifbcy_u= 4, 4, 0.0, 0.0
ifbcy_v= 4, 4, 0.0, 0.0
ifbcy_w= 4, 4, 0.0, 0.0
ifbcy_p= 5, 5, 0.0, 0.0
ifbcy_t= 4, 4, 640.15, 652.15
ifbcz_u= 1, 1, 0.0, 0.0
ifbcz_v= 1, 1, 0.0, 0.0
ifbcz_w= 1, 1, 0.0, 0.0
ifbcz_p= 1, 1, 0.0, 0.0
ifbcz_t= 1, 1, 0.0, 0.0
idriven= none
drivenfc= 0.0

[scheme]
dt= 1.0e-05
itimescheme= rk3
iaccuracy= cd2
iviscous= explicit
out_sponge_L_Re= 0.0, 100.0

[simcontrol]
niterflowfirst= 1
niterflowlast= 60
niterthermofirst= 21
niterthermolast= 60
restart_clock= continue

[io]
cpu_nfre= 10
ckpt_nfre= 50
visu_idim= 2
visu_nfre= 20
visu_nskip= 1, 1, 1
stat_istart= 30
stat_level= 3
stat_nskip= 1, 1, 1
stat_visu_nfre= 40
stat_visu_mode= all
is_record_xoutlet_read_xinlet= .false., .true.
ndbfre_ndbstart_ndbend= 20, 21, 60
ndb_file_offset= 0
existing_output_policy= overwrite
restart_data_layout= bundled
restart_data_layout_read= bundled
restart_data_layout_write= bundled
restart_history_mode= exact
reset_unit_massflux= false
visu_precision= 4

[probe]
npp= 1
pt1= 3.141593, 0.0, 1.5707965
