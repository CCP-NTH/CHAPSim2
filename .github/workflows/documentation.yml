name: Documentation

# Builds the two generated documentation trees the way docs/README.md documents
# building them locally, and fails if the committed output is stale. It does
# not publish anywhere: no deployment target, no secrets, no write permission.

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation:
    name: Build and verify documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FORD
        run: pip install ford==7.0.13

      - name: Generate the FORD code-structure reference
        working-directory: docs/code_structure
        # The project file must stay in Markdown form. FORD 7 reads its
        # settings as python-markdown metadata; a bare .yaml project file is
        # parsed as prose, every key is ignored, and src_dir silently falls
        # back to ./src - the stale source copy in this directory.
        run: ford ford.md

      - name: Check FORD documented the real solver source
        run: |
          # The failure mode above is silent: FORD exits 0 and documents the
          # wrong tree. Compare the sources FORD copied against src/.
          ls src > /tmp/src_actual.txt
          ls docs/code_structure/doc/src > /tmp/src_documented.txt
          if ! diff -u /tmp/src_actual.txt /tmp/src_documented.txt; then
            echo "::error::FORD documented a different source tree than src/. Check src_dir in docs/code_structure/ford.md."
            exit 1
          fi
          echo "FORD documented $(wc -l < /tmp/src_actual.txt) source files, matching src/."

      - name: Rebuild the static guidance preview
        run: python3 docs/guidance/build_static.py

      - name: Check the committed guidance HTML is current
        run: |
          # build_static.py is deterministic, so any diff here means the
          # Markdown under docs/guidance/docs/ was edited without regenerating
          # docs/guidance/html/.
          if ! git diff --exit-code -- docs/guidance/html; then
            echo "::error::docs/guidance/html is stale. Run: python3 docs/guidance/build_static.py, then commit the result."
            exit 1
          fi
          echo "docs/guidance/html matches the committed Markdown."

      - name: Upload generated documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            docs/code_structure/doc
            docs/guidance/html
          if-no-files-found: error
