name: CHAPSim CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      test_type:
        description: "Which tests to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  CHAPSIM_MODE: non-interactive
  # Pin the MPICH/UCX transport to shared memory and TCP. Some hosted runner
  # VMs expose an RDMA device that UCX tries to open and cannot, so MPI_Init
  # aborts before the solver starts:
  #   UCX ERROR ibv_create_srq() failed: Operation not supported
  #   internal_Init(48301): MPI_Init(argc=(nil), argv=(nil)) failed
  # Every case here is single-node, so sm/self carries all the traffic and the
  # IB transports have nothing to contribute. Harmless on a runner that never
  # had the device, and ignored by an MPI that does not use UCX.
  UCX_TLS: sm,self,tcp

jobs:
  # ---------------------------------------------------------------------------
  # Tier 0.5 - static checkers. No build, no solver, seconds to run.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Tier 0.5 static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checker dependencies
        # check_validation_shared_cli.py runs the four shared plotting scripts,
        # which import matplotlib and numpy at module level.
        run: pip install matplotlib numpy

      - name: Run tests/tools/check_*.py
        run: |
          # check_metrics.py is the metric comparator the test runners invoke
          # with file paths, not a standalone checker, so it is excluded.
          #
          # The checkers below already fail on a clean checkout for reasons
          # unrelated to any change under test, so they are reported without
          # going red. No
          # checker is skipped, modified or weakened - every one still runs and
          # its output is printed. A checker that is not on this list and fails
          # is blocking, and a listed checker that starts passing is blocking
          # too, so the list cannot silently rot.
          #
          # One "name|reason" per line. Matching is on the whole file name
          # (awk field equality), so no entry can absorb a different checker.
          KNOWN_FAILING_TABLE="
          check_validation_profile_compat.py|needs validation profile output that no clean checkout contains
          "

          known_reason() {
            printf '%s\n' "$KNOWN_FAILING_TABLE" |
              sed 's/^[[:space:]]*//' |
              awk -F'|' -v n="$1" '$1 == n { print $2; found = 1 } END { exit !found }'
          }

          new_failures=""
          unexpected_passes=""

          {
            echo "| Checker | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for f in tests/tools/check_*.py; do
            b="$(basename "$f")"
            [ "$b" = "check_metrics.py" ] && continue

            if python3 "$f" > "/tmp/${b}.log" 2>&1; then
              passed=yes
            else
              passed=no
            fi

            if reason="$(known_reason "$b")"; then
              known=yes
            else
              known=no
              reason=""
            fi

            if [ "$passed" = yes ] && [ "$known" = no ]; then
              verdict="pass"
            elif [ "$passed" = no ] && [ "$known" = yes ]; then
              verdict="known failure, not blocking -$reason"
            elif [ "$passed" = no ]; then
              verdict="**NEW FAILURE**"
              new_failures="$new_failures $b"
            else
              verdict="**now passing - remove from known-failing**"
              unexpected_passes="$unexpected_passes $b"
            fi

            printf '| %s | %s |\n' "$b" "$verdict" >> "$GITHUB_STEP_SUMMARY"
            printf '%-45s %s\n' "$b" "$verdict"

            if [ "$passed" = no ]; then
              echo "--- output of $b ---"
              cat "/tmp/${b}.log"
              echo "--- end of $b ---"
            fi
          done

          status=0
          if [ -n "$new_failures" ]; then
            echo "::error::New static-checker failures:$new_failures"
            status=1
          fi
          if [ -n "$unexpected_passes" ]; then
            for b in $unexpected_passes; do
              echo "::error file=.github/workflows/ci.yml,title=Remove from known-failing::${b} now passes. Delete its line from KNOWN_FAILING_TABLE in .github/workflows/ci.yml, then re-run."
            done
            {
              echo ""
              echo "### Remove from known-failing"
              echo ""
              echo "These checkers now pass and must stop being tolerated:"
              for b in $unexpected_passes; do
                echo "- \`$b\` - delete from \`KNOWN_FAILING_TABLE\` in \`.github/workflows/ci.yml\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            status=1
          fi
          exit $status

  # ---------------------------------------------------------------------------
  # Tier 0 (clean build) + Tier 1 (smoke: 5 cases x 10 iterations, no crash).
  # ---------------------------------------------------------------------------
  build-and-smoke:
    name: Tier 0 build + Tier 1 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            mpich \
            cmake \
            make \
            python3
          # No libfftw3-dev: CI builds the generic backend bundled in
          # 2decomp-fft, so the runner stays dependency-free. To test FFTW here,
          # add libfftw3-dev back and build with CHAPSIM_FFT=fftw FFTW_ROOT=/usr
          # (the Debian package installs under /usr, not the default /usr/local).

      - name: Make the vendored 2decomp-fft visible to the build script
        run: |
          # build_chapsim.sh decides whether 2decomp-fft is present by testing
          # for lib/2decomp-fft/.git. A fresh checkout has the vendored sources
          # but no nested .git, so the script would delete them and clone
          # upstream master unpinned. Creating an empty repository here keeps
          # the build on the vendored sources and off the network.
          # Proper fix belongs in build_chapsim.sh.
          git -C lib/2decomp-fft init -q

      - name: Build CHAPSim (Tier 0)
        run: |
          set -o pipefail
          ./build_chapsim.sh 2>&1 | tee build_chapsim_stdout.log

      - name: Report build configuration
        if: always()
        run: |
          # Informational only, no gating. CI builds the generic backend
          # bundled in 2decomp-fft, which is the default and needs no external
          # library; FFTW is an opt-in for production runs, selected with
          # CHAPSIM_FFT=fftw. See docs/guidance/docs/fft-backend.md. Reported
          # so that a backend change shows up here rather than as unexplained
          # Tier 3 metric movement.
          backend="not reported"
          if [ -f build_chapsim_stdout.log ]; then
            backend=$(grep -oP 'FFT backend selected: \K.*' build_chapsim_stdout.log | tail -n 1)
            backend=${backend:-"not reported"}
          fi
          echo "2decomp-fft FFT backend: $backend"

          # There is no warning baseline to compare against, so the count is
          # for reading during review, not a gate.
          count="n/a"
          if [ -f build/build.log ]; then
            count=$(grep -c 'Warning:' build/build.log || true)
          fi
          echo "Compiler warnings in build/build.log: $count"

          {
            echo "| Build property | Value |"
            echo "| --- | --- |"
            echo "| 2decomp-fft FFT backend | $backend |"
            echo "| Compiler warnings | $count |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/build.log
            build_chapsim_stdout.log
          if-no-files-found: warn

      - name: Check the polynomial fluid properties
        # Every smoke and regression case uses the NIST-table property path, so
        # the polynomial correlations for the liquid metals and molten salts are
        # otherwise untested. This runs the solver once per fluid on an 8^3 mesh
        # for one iteration and checks the property table it emits. Under a
        # minute in total.
        run: python3 tests/tools/run_fluid_property_tests.py

      - name: Run smoke tests (Tier 1)
        working-directory: tests
        run: ./run_smoke.sh

  # ---------------------------------------------------------------------------
  # Tier 3 - standard regression against tests/tools/tolerances.json.
  # Not a required gate: it runs on master and on explicit dispatch only, and
  # continue-on-error keeps it from blocking the workflow conclusion.
  # ---------------------------------------------------------------------------
  regression:
    name: Tier 3 regression (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build-and-smoke
    continue-on-error: true
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'regression') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            mpich \
            cmake \
            make \
            python3
          # No libfftw3-dev: CI builds the generic backend bundled in
          # 2decomp-fft, so the runner stays dependency-free. To test FFTW here,
          # add libfftw3-dev back and build with CHAPSIM_FFT=fftw FFTW_ROOT=/usr
          # (the Debian package installs under /usr, not the default /usr/local).

      - name: Make the vendored 2decomp-fft visible to the build script
        run: git -C lib/2decomp-fft init -q

      - name: Build CHAPSim
        run: |
          set -o pipefail
          ./build_chapsim.sh 2>&1 | tee build_chapsim_stdout.log

      - name: Report FFT backend
        run: |
          # The committed reference metrics were generated with the generic
          # backend, which is what this job builds. FFTW differs from it by at
          # most 1.3e-07 relative on any metric of non-trivial magnitude -
          # far inside every gate - so a Tier 3 failure here is a real
          # movement, not backend ambiguity. See
          # docs/guidance/docs/fft-backend.md.
          grep -oP 'FFT backend selected: \K.*' build_chapsim_stdout.log | tail -n 1 \
            || echo "FFT backend not reported (library build was skipped)"

      - name: Run standard regression suite
        working-directory: tests
        env:
          TEST_MODE: run
          REGRESSION_SUITE: standard
        run: ./run_regression.sh
